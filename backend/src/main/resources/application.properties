
spring.application.name=college-ai

# PostgreSQL Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
# Local development: set JPA_DDL_AUTO=update in IntelliJ.
# Default for other environments: validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Logging
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ChromaDB Configuration
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.initialize-schema=true

# RAG Retrieval Configuration
rag.retrieval.top-k=3
rag.retrieval.similarity-threshold=0.60

# Google Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Cookie Configuration
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS Configuration
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
